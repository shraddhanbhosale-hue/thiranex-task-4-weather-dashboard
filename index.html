<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Real-time weather dashboard built using JavaScript and the Open-Meteo REST API."
    >

    <title>WeatherFlow | Weather Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app-container">

        <section class="weather-app" aria-labelledby="page-title">

            <header class="app-header">
                <p class="eyebrow">Thiranex Task 4</p>

                <h1 id="page-title">WeatherFlow</h1>

                <p>
                    Check real-time weather conditions for any city.
                </p>
            </header>


            <form id="weather-form" class="search-form">

                <label for="city-input" class="sr-only">
                    Enter city name
                </label>

                <input
                    type="search"
                    id="city-input"
                    placeholder="Enter city name..."
                    autocomplete="off"
                    required
                >

                <button type="submit" id="search-button">
                    Search
                </button>

            </form>


            <div
                id="loading"
                class="status-message hidden"
                aria-live="polite"
            >
                <div class="spinner" aria-hidden="true"></div>
                <p>Loading weather data...</p>
            </div>


            <div
                id="error-message"
                class="status-message error hidden"
                role="alert"
            ></div>


            <section
                id="weather-card"
                class="weather-card hidden"
                aria-live="polite"
            >

                <div class="location">
                    <span class="location-icon" aria-hidden="true">📍</span>

                    <div>
                        <h2 id="city-name">City</h2>
                        <p id="country-name">Country</p>
                    </div>
                </div>


                <div class="weather-main">

                    <div class="weather-icon" id="weather-icon">
                        ☀️
                    </div>

                    <div class="temperature">
                        <span id="temperature">--</span>
                        <sup>°C</sup>
                    </div>

                    <p id="weather-description">
                        Weather condition
                    </p>

                </div>


                <div class="weather-details">

                    <article class="weather-detail">
                        <span class="detail-icon" aria-hidden="true">
                            💧
                        </span>

                        <div>
                            <p>Humidity</p>
                            <strong id="humidity">--%</strong>
                        </div>
                    </article>


                    <article class="weather-detail">
                        <span class="detail-icon" aria-hidden="true">
                            💨
                        </span>

                        <div>
                            <p>Wind Speed</p>
                            <strong id="wind-speed">-- km/h</strong>
                        </div>
                    </article>


                    <article class="weather-detail">
                        <span class="detail-icon" aria-hidden="true">
                            🌡️
                        </span>

                        <div>
                            <p>Feels Like</p>
                            <strong id="feels-like">--°C</strong>
                        </div>
                    </article>


                    <article class="weather-detail">
                        <span class="detail-icon" aria-hidden="true">
                            ☀️
                        </span>

                        <div>
                            <p>Wind Direction</p>
                            <strong id="wind-direction">--°</strong>
                        </div>
                    </article>

                </div>


                <p class="updated-time" id="updated-time">
                    Last updated: --
                </p>

            </section>


            <footer class="app-footer">
                <p>
                    Weather data provided by
                    <a
                        href="https://open-meteo.com/"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        Open-Meteo
                    </a>
                </p>
            </footer>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
